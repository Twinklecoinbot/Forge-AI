name: Deploy Web Preview (GitHub Pages)

# Same Pages URL forever — every push replaces the site in place.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin package version to 1.0.0
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='1.0.0';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
      - run: npm ci
      - run: npm run build
      - name: Ensure Pages helpers
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Summary
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          LIVE="https://${OWNER}.github.io/${REPO}/"
          EXE="https://github.com/${OWNER}/${REPO}/releases/latest/download/Forge-AI-Setup.exe"
          PAGE_URL="${{ steps.deployment.outputs.page_url }}"
          {
            echo "## Stable web (same URL every push)"
            echo ""
            echo "- Live: ${PAGE_URL:-$LIVE}"
            echo "- EXE: ${EXE}"
            echo "- App version channel: **1.0.0** (not auto-bumped)"
          } >> "$GITHUB_STEP_SUMMARY"
